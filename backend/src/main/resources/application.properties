spring.application.name=trello-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/trello_app
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# 開発用のデフォルト値。本番運用する場合は環境変数JWT_SECRETで上書きすること。
app.jwt.secret=${JWT_SECRET:dev-only-secret-key-change-me-please-32bytes-min}
# ログイン保持のため30日間有効
app.jwt.expiration-ms=2592000000
