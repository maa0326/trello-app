spring.application.name=trello-backend

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/trello_app}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8080}

# 開発用のデフォルト値。本番運用する場合は環境変数JWT_SECRETで上書きすること。
app.jwt.secret=${JWT_SECRET:dev-only-secret-key-change-me-please-32bytes-min}
# ログイン保持のため30日間有効
app.jwt.expiration-ms=2592000000

# ローカル開発用のフロントは常に許可。本番フロントのURLはCORS_ALLOWED_ORIGINSにカンマ区切りで追加する
# 例: CORS_ALLOWED_ORIGINS=https://my-trello.vercel.app
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174,${CORS_ALLOWED_ORIGINS:}
